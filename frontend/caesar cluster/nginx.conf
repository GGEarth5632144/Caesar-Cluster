# nginx ของ frontend — ทำ 2 หน้าที่: เสิร์ฟไฟล์ static ของ SPA และ proxy /api ไป backend
#
# ที่ proxy /api ให้ด้วยแทนที่จะให้เบราว์เซอร์ยิงตรงไป backend เพราะทำให้ทุกอย่างเป็น same-origin:
# ไม่ต้องตั้ง CORS ให้ถูก ไม่ต้องเปิดพอร์ต 8080 ออกนอกเครื่อง และเวลาเปลี่ยน IP/โดเมนของเว็บ
# ก็ไม่ต้อง build frontend ใหม่เพราะ path "/api" ไม่เคยเปลี่ยน

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ให้ log ฝั่ง proxy เห็น IP จริงของผู้ใช้ ไม่ใช่ IP ของ container
    real_ip_header X-Forwarded-For;

    client_max_body_size 20m;   # หน้า import รายชื่อ นศ. อัปโหลดไฟล์ xlsx เข้ามา

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ---- API ----
    # ใช้ resolver ของ Docker + ตัวแปร เพื่อให้ nginx ถาม DNS ใหม่เรื่อยๆ
    # ถ้าเขียน upstream แบบตายตัว nginx จะ resolve ครั้งเดียวตอน start แล้วจำ IP นั้นไว้ตลอด
    # พอ recreate container ของ backend แล้วได้ IP ใหม่ หน้าเว็บจะยิง API ไม่ผ่านจนกว่าจะ restart nginx
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $caesar_backend http://backend:8080;

        proxy_pass $caesar_backend$request_uri;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # deploy ขึ้นคลัสเตอร์จริงใช้เวลาได้หลายวินาที (สร้าง namespace + quota + workload)
        proxy_connect_timeout 10s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
    }

    # ---- static assets ----
    # ไฟล์ใน /assets มี hash อยู่ในชื่อ (Vite ใส่ให้) เปลี่ยนเนื้อหาเมื่อไรชื่อก็เปลี่ยน
    # เลย cache ยาวได้อย่างปลอดภัย
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # config.js ถูกเขียนใหม่ทุกครั้งที่ container start — ห้าม cache เด็ดขาด
    # ไม่งั้นเปลี่ยน env แล้ว restart เบราว์เซอร์ยังใช้ค่าเก่าอยู่
    location = /config.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
        try_files $uri =404;
    }

    # index.html ห้าม cache เช่นกัน เพราะเป็นตัวชี้ไปยัง bundle ชื่อใหม่หลัง deploy
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }

    # ---- SPA fallback ----
    # แอปใช้ BrowserRouter และ path ทุกอันเป็น hash ที่สร้างจาก SHA-256 ตอน runtime
    # ไม่มีไฟล์จริงบนดิสก์สักอัน — ถ้าไม่มีบรรทัดนี้ การกด refresh หรือเปิดลิงก์ตรงจะได้ 404 ทุกหน้า
    location / {
        try_files $uri $uri/ /index.html;
    }
}
